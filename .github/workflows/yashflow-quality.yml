name: YashFlow Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: yashflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint
