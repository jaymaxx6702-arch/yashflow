name: YashFlow Quality Check

on:
  push:
    branches:
      - main
      - "stabilization/**"
  pull_request:
    branches: [main]

concurrency:
  group: yashflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript + SQL + Build + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: SQL migration sanity
        run: |
          if grep -RInE '^[[:space:]]*\$;[[:space:]]*$' sql; then
            echo "Malformed SQL dollar terminator found."
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' sql; then
            echo "Merge-conflict marker found in SQL."
            exit 1
          fi
          echo "SQL migration sanity OK"

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-key

      - name: ESLint advisory check
        continue-on-error: true
        run: npm run lint
