name: Build YashFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "public/sounds/notification.wav"
      - ".github/workflows/yashflow-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Add Firebase config
        run: cp mobile/google-services.json mobile/android/app/google-services.json

      - name: Add YashFlow notification sound
        run: |
          mkdir -p mobile/android/app/src/main/res/raw
          cp public/sounds/notification.wav mobile/android/app/src/main/res/raw/yashflow_notification.wav

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YashFlow-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
