<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>YashFlow — Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);background:white;border:1px solid #e2e8f0;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(15,23,42,.08)}
    img{width:92px;height:92px;object-fit:contain}
    .badge{display:inline-block;margin-top:14px;padding:7px 12px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:700;font-size:12px}
    h1{margin:18px 0 8px;font-size:28px}
    p{color:#475569;line-height:1.6}
    .btn{border:0;background:#2563eb;color:white;font-weight:800;padding:13px 18px;border-radius:12px;cursor:pointer;margin-top:12px}
  </style>
</head>
<body>
  <main class="card">
    <img src="/yashflow-logo.png" alt="Yash Laser" />
    <div class="badge">YASHFLOW OFFLINE</div>
    <h1>ઇન્ટરનેટ કનેક્શન નથી</h1>
    <p>YashFlowનું live data જોવા અથવા update કરવા internet જરૂરી છે. Connection ચાલુ થયા પછી ફરી પ્રયત્ન કરો.</p>
    <button class="btn" onclick="location.reload()">↻ ફરી પ્રયત્ન કરો</button>
  </main>
</body>
</html>
